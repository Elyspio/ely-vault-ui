<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#15252e" />
			<stop offset="1" stop-color="#06090c" />
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
			<stop offset="0" stop-color="#4fd2ff" stop-opacity="0.26" />
			<stop offset="1" stop-color="#4fd2ff" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="accent" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
			<stop offset="0" stop-color="#8be7ff" />
			<stop offset="0.55" stop-color="#4fd2ff" />
			<stop offset="1" stop-color="#2b7cff" />
		</linearGradient>
	</defs>

	<!-- Squircle tile -->
	<rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)" />
	<rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)" />
	<rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="#4fd2ff" stroke-opacity="0.22" stroke-width="4" />

	<!-- Vault dial -->
	<circle cx="256" cy="256" r="150" fill="none" stroke="url(#accent)" stroke-width="30" />
	<g stroke="#4fd2ff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.55">
		<line x1="256" y1="132" x2="256" y2="150" />
		<line x1="256" y1="132" x2="256" y2="150" transform="rotate(45 256 256)" />
		<line x1="256" y1="132" x2="256" y2="150" transform="rotate(90 256 256)" />
		<line x1="256" y1="132" x2="256" y2="150" transform="rotate(135 256 256)" />
		<line x1="256" y1="132" x2="256" y2="150" transform="rotate(180 256 256)" />
		<line x1="256" y1="132" x2="256" y2="150" transform="rotate(225 256 256)" />
		<line x1="256" y1="132" x2="256" y2="150" transform="rotate(270 256 256)" />
		<line x1="256" y1="132" x2="256" y2="150" transform="rotate(315 256 256)" />
	</g>
	<!-- Dial marker -->
	<path d="M256 70 L276 104 H236 Z" fill="url(#accent)" />

	<!-- Keyhole -->
	<circle cx="256" cy="236" r="40" fill="url(#accent)" />
	<path d="M236 252 H276 L292 330 Q294 342 282 342 H230 Q218 342 220 330 Z" fill="url(#accent)" />
</svg>
